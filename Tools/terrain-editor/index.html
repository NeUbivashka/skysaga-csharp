    if (hit.object === st.planeMesh) return null;
    const blockId = hit.object.userData ? hit.object.userData.blockId : undefined;
    const g = blockId !== undefined ? st.groups.get(blockId) : null;
    if (!g) return null;
    const coord = g.coords[hit.instanceId];
    if (!coord) return null;
    return { ...coord, blockId };
  }

  function performMouseRaycastAction(clientX, clientY, isContinuous) {
    const st = threeRef.current;
    const canvas = canvas3dRef.current;
    if (!canvas || !st.camera || !st.raycaster) return;
    const dims = dimsRef.current;
    const rect = canvas.getBoundingClientRect();
    const mx = ((clientX - rect.left) / rect.width) * 2 - 1;
    const my = -((clientY - rect.top) / rect.height) * 2 + 1;
    st.raycaster.setFromCamera({ x: mx, y: my }, st.camera);

    const targets = raycastTargets();
    if (!targets.length) return;
    const hits = st.raycaster.intersectObjects(targets, false);
    if (!hits.length) return;
    const hit = hits[0];
    const isErase = toolRef.current === "eraser";
    let cx, cy, cz;

    const hitCoord = coordFromHit(hit);
    if (hitCoord) {
      if (isErase) {
        cx = hitCoord.x;
        cy = hitCoord.y;
        cz = hitCoord.z;
      } else {
        const n = hit.face.normal;
        cx = hitCoord.x + Math.round(n.x);
        cy = hitCoord.y + Math.round(n.y);
        cz = hitCoord.z + Math.round(n.z);
      }
    } else {
      if (isErase) return;
      cx = Math.floor(hit.point.x);
      cz = Math.floor(hit.point.z);
      cy = 0;
    }

    if (
      cx < 0 ||
      cx >= dims.width ||
      cz < 0 ||
      cz >= dims.depth ||
      cy < 0 ||
      cy >= dims.totalHeight
    )
      return;

    if (!isErase && placingEntityRef.current) {
      if (isContinuous) {
        setCurrentLayer(cy);
        return;
      }
      placeEntityAt(placingEntityRef.current, cx, cy, cz);
      setCurrentLayer(cy);
      return;
    }

    if (!isErase && placingStructureRef.current) {
      if (isContinuous) {
        setCurrentLayer(cy);
        return;
      }
      const entry = structuresRef.current.find((s) => s.id === placingStructureRef.current);
      if (entry) stampStructureAt(cx, cy, cz, entry, placingRotationRef.current);
      setCurrentLayer(cy);
      return;
    }

    const key = keyOf(cx, cy, cz);
    const oldEntry = voxelsRef.current.get(key);
    const oldBlock = oldEntry ? oldEntry.block : AIR;
    const newBlock = isErase ? AIR : selectedBlockRef.current;
    setVoxel(cx, cy, cz, newBlock, 0, true);
    syncVoxel3D(cx, cy, cz, oldBlock, newBlock);
    setCurrentLayer(cy);
  }

  function raycastFromCamera() {
    const st = threeRef.current;
    if (!st.camera || !st.raycaster) return null;
    const dir = new THREE.Vector3(0, 0, -1);
    dir.applyQuaternion(st.camera.quaternion);
    st.raycaster.set(st.camera.position, dir);
    const targets = raycastTargets();
    if (!targets.length) return null;
    const hits = st.raycaster.intersectObjects(targets, false);
    return hits.length ? hits[0] : null;
  }

  function performBreak() {
    const hit = raycastFromCamera();
    if (!hit) return;
    const hitCoord = coordFromHit(hit);
    if (!hitCoord) return;
    const dims = dimsRef.current;
    const { x: cx, y: cy, z: cz, blockId } = hitCoord;
    if (
      cx < 0 ||
      cx >= dims.width ||
      cz < 0 ||
      cz >= dims.depth ||
      cy < 0 ||
      cy >= dims.totalHeight
    )
      return;
    setVoxel(cx, cy, cz, AIR, 0, true);
    syncVoxel3D(cx, cy, cz, blockId, 0);
    setCurrentLayer(cy);
  }

  function performPlace() {
    const hit = raycastFromCamera();
    if (!hit) return;
    const dims = dimsRef.current;
    let cx, cy, cz;
    const hitCoord = coordFromHit(hit);
    if (hitCoord) {
      const n = hit.face.normal;
      cx = hitCoord.x + Math.round(n.x);
      cy = hitCoord.y + Math.round(n.y);
      cz = hitCoord.z + Math.round(n.z);
    } else {
      cx = Math.floor(hit.point.x);
      cz = Math.floor(hit.point.z);
      cy = 0;
    }
    if (
      cx < 0 ||
      cx >= dims.width ||
      cz < 0 ||
      cz >= dims.depth ||
      cy < 0 ||
      cy >= dims.totalHeight
    )
      return;

    if (placingEntityRef.current) {
      placeEntityAt(placingEntityRef.current, cx, cy, cz);
      setCurrentLayer(cy);
      return;
    }

    if (placingStructureRef.current) {
      const entry = structuresRef.current.find((s) => s.id === placingStructureRef.current);
      if (entry) stampStructureAt(cx, cy, cz, entry, placingRotationRef.current);
      setCurrentLayer(cy);
      return;
    }

    const key = keyOf(cx, cy, cz);
    const oldEntry = voxelsRef.current.get(key);
    const oldBlock = oldEntry ? oldEntry.block : AIR;
    const newBlock = selectedBlockRef.current;
    setVoxel(cx, cy, cz, newBlock, 0, true);
    syncVoxel3D(cx, cy, cz, oldBlock, newBlock);
    setCurrentLayer(cy);
  }

  function attachOrbitListeners(canvas) {
    const st = threeRef.current;
    function onMouseDown(e) {
      st.drag.isDown = true;
      st.drag.button = e.button;
      st.drag.lastX = e.clientX;
      st.drag.lastY = e.clientY;
      if (e.button === 0) {
        beginStroke();
        performMouseRaycastAction(e.clientX, e.clientY, false);
      }
    }
    function onMouseMove(e) {
      if (!st.drag.isDown) return;
      const dx = e.clientX - st.drag.lastX;
      const dy = e.clientY - st.drag.lastY;
      if (st.drag.button === 0) {
        performMouseRaycastAction(e.clientX, e.clientY, true);
      } else if (st.drag.button === 2 && !e.shiftKey) {
        st.orbit.thetaDelta -= dx * 0.008;
        st.orbit.phiDelta -= dy * 0.008;
      } else if (st.drag.button === 1 || (st.drag.button === 2 && e.shiftKey)) {
        panOrbit(dx, dy);
      }
      st.drag.lastX = e.clientX;
      st.drag.lastY = e.clientY;
    }
    function onMouseUp(e) {
      if (st.drag.isDown && e.button === st.drag.button) {
        if (e.button === 0) commitStroke();
        st.drag.isDown = false;
      }
    }
    function onWheel(e) {
      e.preventDefault();
      const canvas2 = canvas3dRef.current;
      if (!canvas2 || !st.camera || !st.raycaster) return;
      const rect = canvas2.getBoundingClientRect();
      const mx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const my = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      st.raycaster.setFromCamera({ x: mx, y: my }, st.camera);
      const dir = st.raycaster.ray.direction.clone();
      const dims = dimsRef.current;
      const maxR = Math.max(dims.width, dims.depth, dims.totalHeight, 4) * 4 + 20;
      const oldTarget = st.orbit.targetRadius;
      const newTarget = Math.max(
        4,
        Math.min(maxR, oldTarget * (1 + e.deltaY * 0.001))
      );
      const delta = newTarget - oldTarget;
      st.orbit.targetGoal.x += dir.x * -delta;
      st.orbit.targetGoal.y += dir.y * -delta;
      st.orbit.targetGoal.z += dir.z * -delta;
      st.orbit.targetRadius = newTarget;
    }
    function onContextMenu(e) {
      e.preventDefault();
    }
    canvas.addEventListener("mousedown", onMouseDown);
    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseup", onMouseUp);
    canvas.addEventListener("wheel", onWheel, { passive: false });
    canvas.addEventListener("contextmenu", onContextMenu);
    return () => {
      canvas.removeEventListener("mousedown", onMouseDown);
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("mouseup", onMouseUp);
      canvas.removeEventListener("wheel", onWheel);
      canvas.removeEventListener("contextmenu", onContextMenu);
    };
  }

  function attachFlyListeners(canvas) {
    const st = threeRef.current;

    function onCanvasClick() {
      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock();
      }
    }
    function onPointerLockChange() {
      st.locked = document.pointerLockElement === canvas;
      setIsLocked(st.locked);
      if (st.locked) setPointerLockFailed(false);
      if (!st.locked) {
        st.leftDown = false;
        st.keys.forward = false;
        st.keys.back = false;
        st.keys.left = false;
        st.keys.right = false;
        st.keys.up = false;
        st.keys.down = false;
      }
    }
    function onPointerLockError() {
      setPointerLockFailed(true);
    }
    function onMouseMove(e) {
      if (!st.locked) return;
      const sens = 0.0022;
      st.fly.yaw -= e.movementX * sens;
      st.fly.pitch -= e.movementY * sens;
      const lim = Math.PI / 2 - 0.02;
      st.fly.pitch = Math.max(-lim, Math.min(lim, st.fly.pitch));
    }
    function onMouseDown(e) {
      if (!st.locked) return;
      if (e.button === 1) {
        e.preventDefault();
        document.exitPointerLock();
        return;
      }
      if (e.button === 0) {
        beginStroke();
        st.leftDown = true;
        performBreak();
      } else if (e.button === 2) {
        beginStroke();
        performPlace();
        commitStroke();
      }
    }
    function onMouseUp(e) {
      if (e.button === 0 && st.leftDown) {
        st.leftDown = false;
        commitStroke();
      }
    }
    function onContextMenu(e) {
      e.preventDefault();
    }
    function onKeyDown(e) {
      if (!st.locked) return;
      if (e.code === "KeyW") {
        st.keys.forward = true;
        e.preventDefault();
      } else if (e.code === "KeyS") {
        st.keys.back = true;
        e.preventDefault();
      } else if (e.code === "KeyA") {
        st.keys.left = true;
        e.preventDefault();
      } else if (e.code === "KeyD") {
        st.keys.right = true;
        e.preventDefault();
      } else if (e.code === "Space") {
        st.keys.up = true;
        e.preventDefault();
      } else if (e.code === "ShiftLeft" || e.code === "ShiftRight") {
        st.keys.down = true;
        e.preventDefault();
      }
    }
    function onKeyUp(e) {
      if (e.code === "KeyW") st.keys.forward = false;
      else if (e.code === "KeyS") st.keys.back = false;
      else if (e.code === "KeyA") st.keys.left = false;
      else if (e.code === "KeyD") st.keys.right = false;
      else if (e.code === "Space") st.keys.up = false;
      else if (e.code === "ShiftLeft" || e.code === "ShiftRight")
        st.keys.down = false;
    }
    function onWheel(e) {
      e.preventDefault();
      if (!st.camera) return;
      st.camera.fov = Math.max(15, Math.min(100, st.camera.fov * (1 + e.deltaY * 0.001)));
      st.camera.updateProjectionMatrix();
    }

    canvas.addEventListener("click", onCanvasClick);
    document.addEventListener("pointerlockchange", onPointerLockChange);
    document.addEventListener("pointerlockerror", onPointerLockError);
    window.addEventListener("mousemove", onMouseMove);
    canvas.addEventListener("mousedown", onMouseDown);
    window.addEventListener("mouseup", onMouseUp);
    canvas.addEventListener("contextmenu", onContextMenu);
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    canvas.addEventListener("wheel", onWheel, { passive: false });

    return () => {
      canvas.removeEventListener("click", onCanvasClick);
      document.removeEventListener("pointerlockchange", onPointerLockChange);
      document.removeEventListener("pointerlockerror", onPointerLockError);
      window.removeEventListener("mousemove", onMouseMove);
      canvas.removeEventListener("mousedown", onMouseDown);
      window.removeEventListener("mouseup", onMouseUp);
      canvas.removeEventListener("contextmenu", onContextMenu);
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("keyup", onKeyUp);
      canvas.removeEventListener("wheel", onWheel);
      if (document.pointerLockElement === canvas) document.exitPointerLock();
    };
  }

  useEffect(() => {
    if (viewMode === "3d") rebuildEntityMarkers();
  }, [entityInstances, viewMode]);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return undefined;
    function onWheel2d(e) {
      if (viewModeRef.current !== "2d") return;
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const ox = e.clientX - rect.left;
      const oy = e.clientY - rect.top;
      const px = ox + el.scrollLeft;
      const py = oy + el.scrollTop;
      const old = zoomRef.current;
      const next = Math.round(clamp(old * (e.deltaY > 0 ? 0.9 : 1 / 0.9), 0.4, 3) * 100) / 100;
      if (next === old) return;
      zoomRef.current = next;
      setZoom(next);
      requestAnimationFrame(() => {
        el.scrollLeft = px * (next / old) - ox;
        el.scrollTop = py * (next / old) - oy;
      });
    }
    el.addEventListener("wheel", onWheel2d, { passive: false });
    return () => el.removeEventListener("wheel", onWheel2d);
  }, []);

  useEffect(() => {
    if (viewMode !== "3d") return undefined;
    initThree();
    rebuildInstances();
    rebuildEntityMarkers();
    const canvas = canvas3dRef.current;
    const container = containerRef.current;

    function resize() {
      const st = threeRef.current;
      if (!container || !st.renderer || !st.camera) return;
      const w = container.clientWidth || 800;
      const h = container.clientHeight || 500;
      st.renderer.setSize(w, h, true);
      st.camera.aspect = w / Math.max(h, 1);
      st.camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener("resize", resize);

    const mode = cameraModeRef.current;
    const detach =
      mode === "orbit" ? attachOrbitListeners(canvas) : attachFlyListeners(canvas);

    let raf;
    let lastTime = performance.now();
    function loop() {
      raf = requestAnimationFrame(loop);
      const now = performance.now();
      let dt = (now - lastTime) / 1000;
      lastTime = now;
      dt = Math.min(dt, 0.05);

      const st = threeRef.current;

      if (mode === "orbit") {
        const rotFactor = 1 - Math.exp(-dt / 0.09);
        const zoomFactor = 1 - Math.exp(-dt / 0.12);
        const panFactor = 1 - Math.exp(-dt / 0.1);
        const active =
          Math.abs(st.orbit.thetaDelta) > 0.00002 ||
          Math.abs(st.orbit.phiDelta) > 0.00002 ||
          Math.abs(st.orbit.targetRadius - st.orbit.radius) > 0.001 ||
          Math.abs(st.orbit.targetGoal.x - st.orbit.target.x) > 0.001 ||
          Math.abs(st.orbit.targetGoal.y - st.orbit.target.y) > 0.001 ||
          Math.abs(st.orbit.targetGoal.z - st.orbit.target.z) > 0.001;
        if (active) {
          st.orbit.theta += st.orbit.thetaDelta * rotFactor;
          st.orbit.phi = clampPhi(st.orbit.phi + st.orbit.phiDelta * rotFactor);
          st.orbit.thetaDelta *= 1 - rotFactor;
          st.orbit.phiDelta *= 1 - rotFactor;
          st.orbit.radius += (st.orbit.targetRadius - st.orbit.radius) * zoomFactor;
          st.orbit.target.x +=
            (st.orbit.targetGoal.x - st.orbit.target.x) * panFactor;
          st.orbit.target.y +=
            (st.orbit.targetGoal.y - st.orbit.target.y) * panFactor;
          st.orbit.target.z +=
            (st.orbit.targetGoal.z - st.orbit.target.z) * panFactor;
          updateCameraFromOrbit();
        }
      } else {
        if (st.locked) {
          const k = st.keys;
          const fwd = { x: -Math.sin(st.fly.yaw), z: -Math.cos(st.fly.yaw) };
          const right = { x: Math.cos(st.fly.yaw), z: -Math.sin(st.fly.yaw) };
          let ix = 0;
          let iz = 0;
          if (k.forward) {
            ix += fwd.x;
            iz += fwd.z;
          }
          if (k.back) {
            ix -= fwd.x;
            iz -= fwd.z;
          }
          if (k.right) {
            ix += right.x;
            iz += right.z;
          }
          if (k.left) {
            ix -= right.x;
            iz -= right.z;
          }
          const len = Math.hypot(ix, iz);
          if (len > 0.0001) {
            ix /= len;
            iz /= len;
          }
          let iy = 0;
          if (k.up) iy += 1;
          if (k.down) iy -= 1;

          const speed = moveSpeedRef.current;
          const targetVel = { x: ix * speed, y: iy * speed, z: iz * speed };
          const moveFactor = 1 - Math.exp(-dt / 0.08);
          st.fly.velocity.x += (targetVel.x - st.fly.velocity.x) * moveFactor;
          st.fly.velocity.y += (targetVel.y - st.fly.velocity.y) * moveFactor;
          st.fly.velocity.z += (targetVel.z - st.fly.velocity.z) * moveFactor;

          st.fly.position.x += st.fly.velocity.x * dt;
          st.fly.position.y += st.fly.velocity.y * dt;
          st.fly.position.z += st.fly.velocity.z * dt;

          updateCameraFromFly();

          if (st.leftDown) performBreak();
        }
      }

      if (st.renderer && st.scene && st.camera) {
        st.renderer.render(st.scene, st.camera);
      }
    }
    loop();

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      if (detach) detach();
    };
    // eslint-disable-next-line
  }, [viewMode, cameraMode]);

  function resetCameraView() {
    const st = threeRef.current;
    if (cameraModeRef.current === "orbit") {
      st.orbit.initialized = false;
      st.orbit.theta = Math.PI / 4;
      st.orbit.phi = Math.PI / 3;
      st.orbit.thetaDelta = 0;
      st.orbit.phiDelta = 0;
    } else {
      st.fly.initialized = false;
      st.fly.velocity = { x: 0, y: 0, z: 0 };
    }
    rebuildInstances();
  }

  function floodFill(startX, startZ) {
    const startKey = keyOf(startX, currentLayer, startZ);
    const startVal = voxelsRef.current.get(startKey);
    const startBlock = startVal ? startVal.block : AIR;
    if (startBlock === selectedBlock) return;
    const stack = [[startX, startZ]];
    const visited = new Set();
    let iterations = 0;
    beginStroke();
    while (stack.length && iterations < 200000) {
      iterations++;
      const [x, z] = stack.pop();
      if (x < 0 || x >= width || z < 0 || z >= depth) continue;
      const vk = x + "," + z;
      if (visited.has(vk)) continue;
      visited.add(vk);
      const key = keyOf(x, currentLayer, z);
      const val = voxelsRef.current.get(key);
      const block = val ? val.block : AIR;
      if (block !== startBlock) continue;
      setVoxelMirrored(x, currentLayer, z, selectedBlock, 0, true);
      stack.push([x + 1, z]);
      stack.push([x - 1, z]);
      stack.push([x, z + 1]);
      stack.push([x, z - 1]);
    }
    commitStroke();
    draw();
  }

  function fillRect(x0, z0, x1, z1, block) {
    beginStroke();
    const minX = Math.max(0, Math.min(x0, x1));
    const maxX = Math.min(width - 1, Math.max(x0, x1));
    const minZ = Math.max(0, Math.min(z0, z1));
    const maxZ = Math.min(depth - 1, Math.max(z0, z1));
    for (let x = minX; x <= maxX; x++) {
      for (let z = minZ; z <= maxZ; z++) {
        setVoxelMirrored(x, currentLayer, z, block, 0, true);
      }
    }
    commitStroke();
    draw();
  }

  function clearLayer() {
    fillRect(0, 0, width - 1, depth - 1, AIR);
  }

  function fillLayer() {
    fillRect(0, 0, width - 1, depth - 1, selectedBlock);
  }

  function copyLayer(direction) {
    const target = currentLayer + direction;
    if (target < 0 || target >= totalHeight) return;
    beginStroke();
    for (let x = 0; x < width; x++) {
      for (let z = 0; z < depth; z++) {
        const val = voxelsRef.current.get(keyOf(x, currentLayer, z));
        setVoxel(x, target, z, val ? val.block : AIR, val ? val.meta : 0, true);
      }
    }
    commitStroke();
    setStatus(STRINGS.en.layerCopied(target));
  }

  // ---- canvas drawing (2D) ----
  const draw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    canvas.width = width * cell;
    canvas.height = depth * cell;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#12151b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (onionSkin) {
      for (let off = -onionRange; off <= onionRange; off++) {
        if (off === 0) continue;
        const ly = currentLayer + off;
        if (ly < 0 || ly >= totalHeight) continue;
        const alpha = 0.32 / Math.abs(off);
        ctx.globalAlpha = alpha;
        for (const [key, v] of voxelsRef.current) {
          const parts = key.split(",");
          const vy = Number(parts[1]);
          if (vy !== ly) continue;
          const x = Number(parts[0]);
          const z = Number(parts[2]);
          if (x < 0 || x >= width || z < 0 || z >= depth) continue;
          ctx.fillStyle = off < 0 ? "#4a90d9" : "#e0954a";
          ctx.fillRect(x * cell, z * cell, cell, cell);
        }
      }
      ctx.globalAlpha = 1;
    }

    for (const [key, v] of voxelsRef.current) {
      const parts = key.split(",");
      const x = Number(parts[0]);
      const y = Number(parts[1]);
      const z = Number(parts[2]);
      if (y !== currentLayer) continue;
      if (x < 0 || x >= width || z < 0 || z >= depth) continue;
      const img = textureImg2DRef.current.get(v.block);
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x * cell, z * cell, cell, cell);
      } else {
        ctx.fillStyle = colorForId(v.block);
        ctx.fillRect(x * cell, z * cell, cell, cell);
      }
    }

    if (cell >= 6) {
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= width; x++) {
        if (x % CHUNK === 0) continue;
        ctx.beginPath();
        ctx.moveTo(x * cell + 0.5, 0);
        ctx.lineTo(x * cell + 0.5, canvas.height);
        ctx.stroke();
      }
      for (let z = 0; z <= depth; z++) {
        if (z % CHUNK === 0) continue;
        ctx.beginPath();
        ctx.moveTo(0, z * cell + 0.5);
        ctx.lineTo(canvas.width, z * cell + 0.5);
        ctx.stroke();
      }
    }

    ctx.strokeStyle = "rgba(110,168,254,0.55)";
    ctx.lineWidth = 2;
    for (let x = 0; x <= width; x += CHUNK) {
      ctx.beginPath();
      ctx.moveTo(x * cell, 0);
      ctx.lineTo(x * cell, canvas.height);
      ctx.stroke();
    }
    for (let z = 0; z <= depth; z += CHUNK) {
      ctx.beginPath();
      ctx.moveTo(0, z * cell);
      ctx.lineTo(canvas.width, z * cell);
      ctx.stroke();
    }

    if (mirrorX) {
      const gx = (width / 2) * cell;
      ctx.strokeStyle = "rgba(255, 138, 200, 0.6)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (mirrorZ) {
      const gz = (depth / 2) * cell;
      ctx.strokeStyle = "rgba(255, 138, 200, 0.6)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(0, gz);
      ctx.lineTo(canvas.width, gz);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (previewRectRef.current) {
      const { x0, z0, x1, z1 } = previewRectRef.current;
      const rx = Math.min(x0, x1);
      const rz = Math.min(z0, z1);
      const rw = Math.abs(x1 - x0) + 1;
      const rh = Math.abs(z1 - z0) + 1;
      ctx.strokeStyle = "#ffd166";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(rx * cell, rz * cell, rw * cell, rh * cell);
      ctx.setLineDash([]);
    }

    if (roadPending) {
      ctx.strokeStyle = "#ffd166";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(
        roadPending.x * cell + cell / 2,
        roadPending.z * cell + cell / 2,
        cell * 0.6,
        0,
        Math.PI * 2
      );
      ctx.stroke();
    }

    for (const inst of entityInstancesRef.current) {
      if (inst.x < 0 || inst.x >= width || inst.z < 0 || inst.z >= depth) continue;
      const onLayer = inst.y === currentLayer;
      const cx2 = inst.x * cell + cell / 2;
      const cz2 = inst.z * cell + cell / 2;
      const r = cell * 0.38;
      ctx.globalAlpha = onLayer ? 1 : 0.35;
      ctx.fillStyle = "#ff5fa2";
      ctx.strokeStyle = "#2a0a17";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx2, cz2 - r);
      ctx.lineTo(cx2 + r, cz2);
      ctx.lineTo(cx2, cz2 + r);
      ctx.lineTo(cx2 - r, cz2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      if (onLayer && cell >= 18) {
        ctx.fillStyle = "#fff";
        ctx.font = `${Math.max(9, Math.floor(cell * 0.4))}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText((inst.name || "?")[0].toUpperCase(), cx2, cz2 + 0.5);
      }
      ctx.globalAlpha = 1;
    }
  }, [width, depth, cell, currentLayer, mirrorX, mirrorZ, roadPending, onionSkin, onionRange, totalHeight, entityInstances]);

  useEffect(() => {
    draw();
  }, [draw]);

  function cellFromEvent(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const x = Math.floor(px / cell);
    const z = Math.floor(py / cell);
    return { x, z };
  }

  function handleMouseDown(e) {
    const { x, z } = cellFromEvent(e);
    if (x < 0 || x >= width || z < 0 || z >= depth) return;
    if (placingEntityName) {
      const surfaceY = findSurfaceY(x, z);
      const y = surfaceY >= 0 ? surfaceY + 1 : currentLayer;
      placeEntityAt(placingEntityName, x, y, z);
      return;
    }
    if (placingStructureId) {
      const entry = structures.find((s) => s.id === placingStructureId);
      if (entry) stampStructureAt(x, currentLayer, z, entry, placingRotation);
      return;
    }
    if (tool === "paste") {
      pasteRegionAt(x, z);
      return;
    }
    if (tool === "road") {
      if (!roadStartRef.current) {
        roadStartRef.current = { x, z };
        setRoadPending({ x, z });
      } else {
        const start = roadStartRef.current;
        drawRoad(start.x, start.z, x, z, roadWidth, roadBlock);
        roadStartRef.current = null;
        setRoadPending(null);
      }
      return;
    }
    isDrawingRef.current = true;
    if (tool === "pencil" || tool === "eraser") {
      beginStroke();
      setVoxelMirrored(x, currentLayer, z, tool === "eraser" ? AIR : selectedBlock, 0, true);
      draw();
    } else if (tool === "rect-fill" || tool === "rect-erase" || tool === "copy") {
      rectStartRef.current = { x, z };
      previewRectRef.current = { x0: x, z0: z, x1: x, z1: z };
      draw();
    } else if (tool === "bucket") {
      floodFill(x, z);
    }
  }

  function handleMouseMove(e) {
    const { x, z } = cellFromEvent(e);
    setHoverCell({ x, z });
    if (!isDrawingRef.current) return;
    if (x < 0 || x >= width || z < 0 || z >= depth) return;
    if (tool === "pencil" || tool === "eraser") {
      setVoxelMirrored(x, currentLayer, z, tool === "eraser" ? AIR : selectedBlock, 0, true);
      draw();
    } else if (tool === "rect-fill" || tool === "rect-erase" || tool === "copy") {
      if (rectStartRef.current) {
        previewRectRef.current = {
          x0: rectStartRef.current.x,
          z0: rectStartRef.current.z,
          x1: x,
          z1: z,
        };
        draw();
      }
    }
  }

  function handleMouseUp() {
    if (!isDrawingRef.current) return;
    isDrawingRef.current = false;
    if (tool === "pencil" || tool === "eraser") {
      commitStroke();
    } else if (tool === "rect-fill" || tool === "rect-erase") {
      if (previewRectRef.current) {
        const { x0, z0, x1, z1 } = previewRectRef.current;
        fillRect(x0, z0, x1, z1, tool === "rect-erase" ? AIR : selectedBlock);
      }
      rectStartRef.current = null;
      previewRectRef.current = null;
      draw();
    } else if (tool === "copy") {
      if (previewRectRef.current) {
        const { x0, z0, x1, z1 } = previewRectRef.current;
        copyRegion(x0, z0, x1, z1);
      }
      rectStartRef.current = null;
      previewRectRef.current = null;
      draw();
    }
  }

  function handleMouseLeave() {
    if (isDrawingRef.current && (tool === "pencil" || tool === "eraser")) {
      commitStroke();
    }
    isDrawingRef.current = false;
    rectStartRef.current = null;
    previewRectRef.current = null;
    setHoverCell(null);
    draw();
  }

  useEffect(() => {
    function onKey(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        if (e.shiftKey) redo();
        else undo();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
        e.preventDefault();
        redo();
        return;
      }
      if (placingEntityRef.current) {
        if (e.key === "Escape") {
          e.preventDefault();
          setPlacingEntityName(null);
        }
        return;
      }
      if (placingStructureRef.current) {
        const tag = e.target && e.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        if (e.key.toLowerCase() === "r") {
          e.preventDefault();
          setPlacingRotation((r) => (r + 1) % 4);
        } else if (e.key === "Escape") {
          e.preventDefault();
          setPlacingStructureId(null);
        }
        return;
      }
      if (/^[0-9]$/.test(e.key)) {
        const tag = e.target && e.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        const slot = e.key === "0" ? 9 : Number(e.key) - 1;
        e.preventDefault();
        selectHotbarSlot(slot);
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
    // eslint-disable-next-line
  }, []);

  // ---- grid size changes: clip out-of-bounds voxels ----
  function applyGridResize(nx, ny, nz) {
    const newW = nx * CHUNK;
    const newD = nz * CHUNK;
    const newH = ny * CHUNK;
    const m = voxelsRef.current;
    for (const key of Array.from(m.keys())) {
      const parts = key.split(",");
      const x = Number(parts[0]);
      const y = Number(parts[1]);
      const z = Number(parts[2]);
      if (x >= newW || y >= newH || z >= newD) m.delete(key);
    }
    setGridX(nx);
    setGridY(ny);
    setGridZ(nz);
    if (currentLayer >= newH) setCurrentLayer(newH - 1);
    setVoxelCount(m.size);
    undoStackRef.current = [];
    scheduleSave();
  }

  // ---- export / import ----
  function buildExportData() {
    const voxels = [];
    for (const [key, v] of voxelsRef.current) {
      const parts = key.split(",");
      voxels.push({
        x: Number(parts[0]),
        y: Number(parts[1]),
        z: Number(parts[2]),
        block: v.block,
        meta: v.meta || 0,
      });
    }
    return {
      mapSizeChunks: { x: gridX, y: gridY, z: gridZ },
      biomeName: biomeName,
      gameMode: gameMode,
      voxels: voxels,
      entities: entityInstancesRef.current.map((e) =>
        e.items && e.items.length
          ? { name: e.name, x: e.x, y: e.y, z: e.z, items: e.items }
          : { name: e.name, x: e.x, y: e.y, z: e.z }
      ),
    };
  }

  function ensureAirship() {
    if (entityInstancesRef.current.some((e) => e.name === "Airship")) return true;
    const dims = dimsRef.current;
    const insetX = Math.round(dims.width * 0.3);
    const insetZ = Math.round(dims.depth * 0.3);
    const side = Math.floor(Math.random() * 4);
    const along = 0.3 + Math.random() * 0.4;
    const startX = side === 0 ? insetX : side === 1 ? dims.width - 1 - insetX : Math.round(dims.width * along);
    const startZ = side === 2 ? insetZ : side === 3 ? dims.depth - 1 - insetZ : Math.round(dims.depth * along);
    let spot = null;
    for (let r = 0; r <= Math.max(dims.width, dims.depth) && !spot; r++) {
      for (let dx = -r; dx <= r && !spot; dx++) {
        for (let dz = -r; dz <= r && !spot; dz++) {
          if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
          const x = startX + dx;
          const z = startZ + dz;
          if (x < 0 || x >= dims.width || z < 0 || z >= dims.depth) continue;
          const y = findSurfaceY(x, z);
          if (y >= 0 && y + 1 < dims.totalHeight) spot = { x, y: y + 1, z };
        }
      }
    }
    if (!spot) {
      setStatus(STRINGS.en.airshipNoGround);
      return false;
    }
    const instance = { id: Date.now() + Math.floor(Math.random() * 1000), name: "Airship", ...spot, items: [] };
    entityInstancesRef.current = [...entityInstancesRef.current, instance];
    setEntityInstances(entityInstancesRef.current);
    draw();
    scheduleSave();
    return true;
  }

  function exportJson() {
    if (!ensureAirship()) return;
    const data = buildExportData();
    const blob = new Blob([JSON.stringify(data, null, 2)], {
      type: "application/json",
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "worldmap.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus(STRINGS.en.exportedCount(data.voxels.length));
  }

  async function exportJsonCompressed() {
    if (typeof CompressionStream === "undefined") {
      setStatus(STRINGS.en.compressionUnsupported);
      return;
    }
    if (!ensureAirship()) return;
    const data = buildExportData();
    const json = JSON.stringify(data);
    const rawBlob = new Blob([json], { type: "application/json" });
    const cs = new CompressionStream("gzip");
    const compressedStream = rawBlob.stream().pipeThrough(cs);
    const compressedBlob = await new Response(compressedStream).blob();
    const url = URL.createObjectURL(compressedBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "worldmap.json.gz";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const pct = json.length > 0 ? Math.round((1 - compressedBlob.size / json.length) * 100) : 0;
    setStatus(STRINGS.en.exportedCompressed(json.length, compressedBlob.size, pct));
  }

  // ---- named save slots ----
  async function refreshSaveSlots() {
    try {
      const res = await window.storage.list("terrain-editor-slot:", false);
      const names = (res && res.keys ? res.keys : []).map((k) =>
        k.slice("terrain-editor-slot:".length)
      );
      setSaveSlots(names.sort());
    } catch (e) {
      setSaveSlots([]);
    }
  }

  async function saveNamedSlot(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    const data = buildExportData();
    data.paletteLabels = palette;
    try {
      await window.storage.set("terrain-editor-slot:" + trimmed, JSON.stringify(data), false);
      await refreshSaveSlots();
      setStatus(STRINGS.en.slotSaved(trimmed));
    } catch (e) {
      // ignore, non-critical
    }
  }

  async function loadNamedSlot(name) {
    try {
      const res = await window.storage.get("terrain-editor-slot:" + name, false);
      if (res && res.value) {
        const data = JSON.parse(res.value);
        applyLoadedData(data);
        draw();
        if (viewMode === "3d") rebuildInstances();
        setStatus(STRINGS.en.slotLoaded(name));
      }
    } catch (e) {
      // ignore
    }
  }

  async function deleteNamedSlot(name) {
    try {
      await window.storage.delete("terrain-editor-slot:" + name, false);
      await refreshSaveSlots();
    } catch (e) {
      // ignore
    }
  }

  async function refreshPresets() {
    try {
      const res = await window.storage.list("terrain-editor-preset:", false);
      const names = (res && res.keys ? res.keys : []).map((k) =>
        k.slice("terrain-editor-preset:".length)
      );
      setPresets(names.sort());
    } catch (e) {
      setPresets([]);
    }
  }

  async function savePreset(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    try {
      await window.storage.set(
        "terrain-editor-preset:" + trimmed,
        JSON.stringify(getGeneratorParams()),
        false
      );
      await refreshPresets();
      setStatus(STRINGS.en.presetSaved(trimmed));
    } catch (e) {
      // ignore
    }
  }

  async function loadPreset(name) {
    try {
      const res = await window.storage.get("terrain-editor-preset:" + name, false);
      if (res && res.value) {
        applyGeneratorParams(JSON.parse(res.value));
        setStatus(STRINGS.en.presetLoaded(name));
      }
    } catch (e) {
      // ignore
    }
  }

  async function deletePreset(name) {
    try {
      await window.storage.delete("terrain-editor-preset:" + name, false);
      await refreshPresets();
    } catch (e) {
      // ignore
    }
  }

  // ---- map statistics ----
  function computeMapStats() {
    const counts = new Map();
    for (const [, v] of voxelsRef.current) {
      counts.set(v.block, (counts.get(v.block) || 0) + 1);
    }
    const total = voxelsRef.current.size;
    const rows = Array.from(counts.entries())
      .map(([id, count]) => ({
        id,
        count,
        pct: total > 0 ? ((count / total) * 100).toFixed(1) : "0",
        name: BLOCK_NAMES[id] || (palette.find((p) => p.id === id) || {}).label || null,
      }))
      .sort((a, b) => b.count - a.count);
    setStatsData({ total, rows });
    setShowStats(true);
  }

  function importJson(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        applyLoadedData(data);
        draw();
        setStatus(STRINGS.en.importedFrom(file.name));
        if (viewMode === "3d") rebuildInstances();
      } catch (err) {
        setStatus(STRINGS.en.importError(err.message));
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function selectHotbarSlot(i) {
    setHotbarIndex(i);
    const id = hotbarRef.current[i];
    if (id) setSelectedBlock(id);
  }

  function assignHotbarSlot(i, blockId) {
    setHotbar((prev) => {
      const next = [...prev];
      next[i] = blockId;
      return next;
    });
    scheduleSave();
  }

  function cycleHotbar(direction) {
    const st = hotbarRef;
    let idx = hotbarIndexRef.current;
    for (let i = 0; i < 10; i++) {
      idx = (idx + direction + 10) % 10;
      if (st.current[idx]) break;
    }
    setHotbarIndex(idx);
    if (st.current[idx]) setSelectedBlock(st.current[idx]);
  }

              >
                <div style={{ fontSize: 11, color: "#8a91a3" }}>{t.regenHint}</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  <button style={actionBtn} onClick={regenerateDecorations}>
                    {t.regenDeco}
                  </button>
                  <button style={actionBtn} onClick={regenerateTrees}>
                    {t.regenTrees}
                  </button>
                  <button style={actionBtn} onClick={regenerateOre}>
                    {t.regenOre}
                  </button>
                </div>
              </div>
            </div>
          )}

          {showEntitiesPanel && (
            <div
              style={{
                display: "flex",
                flexDirection: "column",
                gap: 8,
                padding: "10px 12px",
                borderBottom: "1px solid #1e222b",
                background: "#1c1219",
                maxHeight: 340,
                overflowY: "auto",
              }}
            >
              <div style={{ fontSize: 11, color: "#e0a3c0" }}>{t.entitiesHint}</div>

              {placingEntityName && (
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                    padding: "6px 8px",
                    borderRadius: 6,
                    background: "#3a1b2c",
                    border: "1px solid #ff5fa2",
                  }}
                >
                  <span style={{ fontSize: 12, flex: 1 }}>
                    {t.entityArmed(placingEntityName)}
                  </span>
                  <button style={actionBtn} onClick={() => setPlacingEntityName(null)}>
                    {t.cancel}
                  </button>
                </div>
              )}

              <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                {["all", ...ENTITY_CATEGORIES].map((c) => (
                  <button
                    key={c}
                    onClick={() => setEntityCategory(c)}
                    style={{
                      ...actionBtn,
                      padding: "3px 8px",
                      background: entityCategory === c ? "#22314d" : actionBtn.background,
                    }}
                  >
                    {c === "all" ? t.entityCategoryAll : t.entityCategoryNames[c]} (
                    {c === "all" ? ENTITIES.length : ENTITIES.filter((en) => en.category === c).length})
                  </button>
                ))}
              </div>
              <input
                type="text"
                value={entitySearchQuery}
                onChange={(e) => setEntitySearchQuery(e.target.value)}
                placeholder={t.entitySearchPlaceholder}
                style={{ ...inputStyle, width: "100%" }}
              />

              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: 2,
                  maxHeight: 140,
                  overflowY: "auto",
                  border: "1px solid #2a2f3a",
                  borderRadius: 6,
                  padding: 4,
                }}
              >
                {ENTITIES.filter(
                  (en) =>
                    (entityCategory === "all" || en.category === entityCategory) &&
                    en.name.toLowerCase().includes(entitySearchQuery.toLowerCase())
                )
                  .slice(0, 200)
                  .map((en) => {
                    const n = en.name;
                    const isSingleton = SINGLETON_ENTITY_NAMES.has(n);
                    const alreadyPlaced =
                      isSingleton && entityInstances.some((e) => e.name === n);
                    return (
                      <div
                        key={n}
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: 8,
                          padding: "3px 6px",
                          borderRadius: 4,
                          background: placingEntityName === n ? "#3a1b2c" : "transparent",
                          opacity: alreadyPlaced ? 0.5 : 1,
                        }}
                      >
                        <span
                          style={{
                            width: 8,
                            height: 8,
                            borderRadius: 2,
                            flexShrink: 0,
                            background: "#" + ENTITY_COLORS[en.category].toString(16).padStart(6, "0"),
                          }}
                        />
                        <span style={{ fontSize: 12, flex: 1 }}>{n}</span>
                        {isSingleton && (
                          <span style={{ fontSize: 10, color: "#8a91a3" }}>
                            {t.entitySingletonBadge}
                          </span>
                        )}
                        <button
                          style={{ ...actionBtn, padding: "2px 8px" }}
                          onClick={() => setPlacingEntityName(n)}
                          disabled={alreadyPlaced}
                          title={alreadyPlaced ? t.entitySingletonBlocked(n) : undefined}
                        >
                          📍
                        </button>
                      </div>
                    );
                  })}
                {ENTITIES.filter(
                  (en) =>
                    (entityCategory === "all" || en.category === entityCategory) &&
                    en.name.toLowerCase().includes(entitySearchQuery.toLowerCase())
                ).length === 0 && (
                  <div style={{ fontSize: 12, color: "#5c6272", padding: 4 }}>
                    {t.noEntityMatches}
                  </div>
                )}
              </div>

              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  borderTop: "1px solid #2a2f3a",
                  paddingTop: 8,
                  marginTop: 2,
                }}
              >
                <div style={{ fontSize: 11, color: "#8a91a3" }}>
                  {t.entitiesPlacedCount(entityInstances.length)}
                </div>
                {entityInstances.length > 0 && (
                  <button style={actionBtn} onClick={clearAllEntityInstances}>
                    {t.clearAll}
                  </button>
                )}
              </div>

              {entityInstances.map((inst) => (
                <div
                  key={inst.id}
                  style={{
                    display: "flex",
                    flexWrap: "wrap",
                    alignItems: "center",
                    gap: 8,
                    padding: "5px 8px",
                    borderRadius: 6,
                    background: "#0e1117",
                  }}
                >
                  <span
                    style={{
                      width: 10,
                      height: 10,
                      borderRadius: 2,
                      background: ENTITY_CATEGORY.has(inst.name)
                        ? "#" + ENTITY_COLORS[ENTITY_CATEGORY.get(inst.name)].toString(16).padStart(6, "0")
                        : "#ff5fa2",
                      flexShrink: 0,
                    }}
                  />
                  <span style={{ fontSize: 12, flex: 1 }}>{inst.name}</span>
                  {!ENTITY_CATEGORY.has(inst.name) && (
                    <span style={{ fontSize: 10, color: "#ffb86b" }}>{t.entityServiceBadge}</span>
                  )}
                  <span style={{ fontSize: 11, color: "#8a91a3" }}>
                    {inst.x}, {inst.y}, {inst.z}
                  </span>
                  <button
                    style={{ ...actionBtn, background: openItemsId === inst.id ? "#22314d" : actionBtn.background }}
                    onClick={() => setOpenItemsId(openItemsId === inst.id ? null : inst.id)}
                    title={t.entityItemsHint}
                  >
                    {t.entityItems} ({(inst.items || []).length})
                  </button>
                  <button style={actionBtn} onClick={() => removeEntityInstance(inst.id)}>
                    {t.slotDelete}
                  </button>
                  {openItemsId === inst.id && (
                    <textarea
                      defaultValue={(inst.items || []).join("\n")}
                      onBlur={(e) => setEntityItems(inst.id, e.target.value)}
                      placeholder={t.entityItemsHint}
                      rows={6}
                      style={{ ...inputStyle, width: "100%", boxSizing: "border-box", flexBasis: "100%", fontSize: 11 }}
                    />
                  )}
                </div>
              ))}
            </div>
          )}

          <div
            ref={containerRef}
            style={{
              flex: 1,
              minHeight: 0,
              overflow: viewMode === "2d" ? "auto" : "hidden",
              padding: viewMode === "2d" ? 16 : 0,
              background: "#08090c",
              position: "relative",
            }}
          >
            <canvas
              ref={canvasRef}
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={handleMouseUp}
              onMouseLeave={handleMouseLeave}
              style={{
                display: viewMode === "2d" ? "block" : "none",
                cursor: "crosshair",
                imageRendering: "pixelated",
                boxShadow: "0 0 0 1px #2a2f3a",
              }}
            />
            <canvas
              ref={canvas3dRef}
              style={{
                display: viewMode === "3d" ? "block" : "none",
                width: "100%",
                height: "100%",
                cursor: "crosshair",
              }}
            />
            {viewMode === "3d" && cameraMode === "fly" && (
              <>
                <div
                  style={{
                    position: "absolute",
                    top: "50%",
                    left: "50%",
                    width: 18,
                    height: 18,
                    marginLeft: -9,
                    marginTop: -9,
                    pointerEvents: "none",
                  }}
                >
                  <div
                    style={{
                      position: "absolute",
                      left: 8,
                      top: 0,
                      width: 2,
                      height: 18,
                      background: "rgba(255,255,255,0.85)",
                      boxShadow: "0 0 2px rgba(0,0,0,0.8)",
                    }}
                  />
                  <div
                    style={{
                      position: "absolute",
                      top: 8,
                      left: 0,
                      width: 18,
                      height: 2,
                      background: "rgba(255,255,255,0.85)",
                      boxShadow: "0 0 2px rgba(0,0,0,0.8)",
                    }}
                  />
                </div>
                {!isLocked && (
                  <div
                    style={{
                      position: "absolute",
                      inset: 0,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      background: "rgba(8,9,12,0.6)",
                      pointerEvents: "none",
                      textAlign: "center",
                    }}
                  >
                    <div>
                      <div style={{ fontSize: 16, color: "#e6e8ee", marginBottom: 8 }}>
                        {t.clickToPlay}
                      </div>
                      <div
                        style={{
                          fontSize: 12,
                          color: "#8a91a3",
                          lineHeight: 1.6,
                          whiteSpace: "pre-line",
                        }}
                      >
                        {t.controlsFly}
                      </div>
                      {pointerLockFailed && (
                        <div style={{ fontSize: 11, color: "#ff9e9e", marginTop: 10 }}>
                          {t.pointerLockFailedMsg}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </>
            )}

            <div
              style={{
                position: "absolute",
                bottom: 10,
                left: "50%",
                transform: "translateX(-50%)",
                display: "flex",
                gap: 4,
                background: "rgba(10,12,17,0.85)",
                border: "1px solid #2a2f3a",
                borderRadius: 8,
                padding: 5,
                pointerEvents: viewMode === "3d" && cameraMode === "fly" && isLocked ? "none" : "auto",
              }}
              title={t.hotbarHint}
            >
              {hotbar.map((blockId, i) => (
                <div
                  key={i}
                  onClick={() => selectHotbarSlot(i)}
                  onContextMenu={(e) => {
                    e.preventDefault();
                    assignHotbarSlot(i, selectedBlock);
                  }}
                  style={{
                    width: 34,
                    height: 34,
                    borderRadius: 5,
                    background: blockId ? colorForId(blockId) : "#1a1d24",
                    border:
                      hotbarIndex === i ? "2px solid #6ea8fe" : "1px solid #2a2f3a",
                    cursor: "pointer",
                    position: "relative",
                    flexShrink: 0,
                  }}
                >
                  <span
                    style={{
                      position: "absolute",
                      bottom: 1,
                      right: 3,
                      fontSize: 9,
                      color: "rgba(255,255,255,0.7)",
                    }}
                  >
                    {i === 9 ? 0 : i + 1}
                  </span>
                </div>
              ))}
            </div>
          </div>

          <div
            style={{
              display: "flex",
              gap: 16,
              padding: "6px 14px",
              borderTop: "1px solid #1e222b",
              fontSize: 11,
              color: "#8a91a3",
              background: "#0e1117",
            }}
          >
            <span>
              {t.cursor}{" "}
              {hoverCell
                ? `X=${hoverCell.x} Z=${hoverCell.z} (${Math.floor(
                    hoverCell.x / CHUNK
                  )},${chunkY},${Math.floor(hoverCell.z / CHUNK)})`
                : "—"}
            </span>
            <span>
              {t.totalVoxels} {voxelCount}
            </span>
            <span>{status}</span>
          </div>
        </div>

        {/* right: layer nav */}
        {viewMode === "2d" && (
          <div
            style={{
              width: 170,
              borderLeft: "1px solid #1e222b",
              padding: 12,
              background: "#0e1117",
            }}
          >
            <div style={{ fontSize: 12, color: "#8a91a3", marginBottom: 8 }}>
              {t.layerY}
            </div>
            <div style={{ fontSize: 22, fontWeight: 700, color: "#6ea8fe" }}>
              {currentLayer}
            </div>
            <div style={{ fontSize: 11, color: "#8a91a3", marginBottom: 8 }}>
              {t.chunkLocal(chunkY, localY)}
            </div>
            <input
              type="range"
              min={0}
              max={totalHeight - 1}
              value={currentLayer}
              onChange={(e) => setCurrentLayer(Number(e.target.value))}
              style={{ width: "100%" }}
            />
            <div style={{ display: "flex", gap: 4, marginTop: 8 }}>
              <button
                style={actionBtn}
                onClick={() => setCurrentLayer(Math.max(0, currentLayer - 1))}
              >
                ↓
              </button>
              <button
                style={actionBtn}
                onClick={() =>
                  setCurrentLayer(Math.min(totalHeight - 1, currentLayer + 1))
                }
              >
                ↑
              </button>
            </div>

            <div style={{ marginTop: 14, fontSize: 11, color: "#8a91a3" }}>
              {t.quickJump}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 3, marginTop: 4 }}>
              {Array.from({ length: gridY }).map((_, cy) => (
                <button
                  key={cy}
                  onClick={() => setCurrentLayer(cy * CHUNK)}
                  style={{
                    ...actionBtn,
                    textAlign: "left",
                    background: chunkY === cy ? "#22314d" : "#1a1d24",
                  }}
                >
                  {t.chunkY(cy)}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>

      {showHelp && (
        <div
          onClick={() => setShowHelp(false)}
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.65)",
            zIndex: 100,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: 20,
          }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              background: "#12151b",
              border: "1px solid #2a2f3a",
              borderRadius: 10,
              maxWidth: 720,
              width: "100%",
              maxHeight: "85vh",
              display: "flex",
              flexDirection: "column",
              boxShadow: "0 12px 40px rgba(0,0,0,0.6)",
            }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
                padding: "12px 16px",
                borderBottom: "1px solid #1e222b",
              }}
            >
              <div style={{ fontWeight: 700, fontSize: 14, color: "#6ea8fe" }}>
                {t.helpTitle}
              </div>
              <button onClick={() => setShowHelp(false)} style={actionBtn}>
                ✕
              </button>
            </div>
            <div style={{ overflowY: "auto", padding: 16 }}>
              <div
                style={{
                  fontSize: 12.5,
                  lineHeight: 1.6,
                  color: "#dfe3ea",
                  whiteSpace: "pre-line",
                }}
              >
                {t.helpUsage}
              </div>
              <div
                style={{
                  marginTop: 20,
                  paddingTop: 14,
                  borderTop: "1px solid #1e222b",
                  fontSize: 12,
                  fontWeight: 700,
                  color: "#8a91a3",
                  letterSpacing: 0.5,
                }}
              >
                {t.helpChangelogTitle}
              </div>
              <div
                style={{
                  marginTop: 8,
                  fontSize: 12,
                  lineHeight: 1.6,
                  color: "#b7bcc7",
                  whiteSpace: "pre-line",
                }}
              >
                {t.helpChangelog}
              </div>
            </div>
          </div>
        </div>
      )}

      {showStats && statsData && (
        <div
          onClick={() => setShowStats(false)}
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.65)",
            zIndex: 100,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: 20,
          }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              background: "#12151b",
              border: "1px solid #2a2f3a",
              borderRadius: 10,
              maxWidth: 480,
              width: "100%",
              maxHeight: "80vh",
              display: "flex",
              flexDirection: "column",
              boxShadow: "0 12px 40px rgba(0,0,0,0.6)",
            }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
                padding: "12px 16px",
                borderBottom: "1px solid #1e222b",
              }}
            >
              <div style={{ fontWeight: 700, fontSize: 14, color: "#6ea8fe" }}>
                {t.statsTitle}
              </div>
              <button onClick={() => setShowStats(false)} style={actionBtn}>
                ✕
              </button>
            </div>
            <div style={{ overflowY: "auto", padding: 16 }}>
              {statsData.total === 0 ? (
                <div style={{ fontSize: 12, color: "#8a91a3" }}>{t.statsNoData}</div>
              ) : (
                <>
                  <div style={{ fontSize: 12, color: "#8a91a3", marginBottom: 10 }}>
                    {t.statsTotal(statsData.total)}
                  </div>
                  {statsData.rows.map((row) => (
                    <div
                      key={row.id}
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 10,
                        padding: "5px 0",
                        borderBottom: "1px solid #1a1d24",
                      }}
                    >
                      <span
                        style={{
                          width: 14,
                          height: 14,
                          borderRadius: 3,
                          background: colorForId(row.id),
                          flexShrink: 0,
                        }}
                      />
                      <span style={{ fontSize: 11, color: "#8a91a3", width: 28 }}>{row.id}</span>
                      <span style={{ fontSize: 12, flex: 1 }}>{row.name || "—"}</span>
                      <span style={{ fontSize: 12, color: "#dfe3ea" }}>{row.count}</span>
                      <span style={{ fontSize: 11, color: "#8a91a3", width: 44, textAlign: "right" }}>
                        {row.pct}%
                      </span>
                    </div>
                  ))}
                </>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const inputStyle = {
  background: "#1a1d24",
  border: "1px solid #2a2f3a",
  borderRadius: 5,
  color: "#e6e8ee",
  padding: "4px 6px",
  width: 50,
  fontSize: 12,
};

const actionBtn = {
  padding: "6px 10px",
  borderRadius: 6,
  border: "1px solid #2a2f3a",
  background: "#1a1d24",
  color: "#e6e8ee",
  fontSize: 12,
  cursor: "pointer",
};


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TerrainEditor />);

} catch (err) {
  var rootEl = document.getElementById('root');
  rootEl.innerHTML = '<pre style="color:#ff9e9e;background:#0b0d12;padding:20px;' +
    'font-family:monospace;white-space:pre-wrap;font-size:13px;margin:0;">' +
    'Editor error:\n\n' + (err && err.message ? err.message : String(err)) +
    (err && err.stack ? ('\n\n' + err.stack) : '') + '</pre>';
  console.error(err);
}
</script>
</body>
</html>
