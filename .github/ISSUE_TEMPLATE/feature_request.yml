name: Feature / research task
description: Implement a game feature, packet or RE finding
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: Which feature, packet or system, and how it behaves in the original game.
    validations:
      required: true
  - type: textarea
    id: known
    attributes:
      label: What is known
      description: RPC names and ordinals, client functions and addresses, GeoData fields, captured bytes. Mark what is confirmed in client 36731 and what is a guess.
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Wiki pages, captures, videos of the original game, Discord threads.
