name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: build
    attributes:
      label: Client build
      placeholder: 38328 (Beta1)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, expected vs actual behaviour.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server.log / console output. Remove IPs and account data.
      render: text
